<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>送迎表メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@700&display=swap">
<style>
/* Layout: 上部に日付と作成ボタン、左に「今日の利用・出勤」、右に運行タイムラインと便カード。マスタ登録はタブで切替。 */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --sunken:#EAEEF2; --line:#D8DFE6; --ink:#17212B; --muted:#5A6876;
  --accent:#1E5C86; --accent-ink:#FFFFFF; --accent-soft:#E1ECF5;
  --ok:#2C7A4B; --ok-soft:#E3F2E8; --warn:#9A5B00; --warn-soft:#FFF1D6; --bad:#B0281F; --bad-soft:#FBE6E4;
  --v1:#2F6FAD; --v2:#C2572B; --v3:#2E8A5C; --v4:#8A4FB0; --v5:#B8891A; --v6:#C23B6B; --v7:#3E8C99; --v8:#6B6F2A;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151B; --surface:#17202A; --sunken:#121A22; --line:#2A3643; --ink:#E5ECF2; --muted:#98A6B4;
  --accent:#72B2DF; --accent-ink:#0C1620; --accent-soft:#1A3248;
  --ok:#6CC892; --ok-soft:#163222; --warn:#F0B44C; --warn-soft:#382A12; --bad:#F2877F; --bad-soft:#3B1C1A;
  --v1:#6AA5DC; --v2:#E58A62; --v3:#5DBE8C; --v4:#B488D6; --v5:#DDB24A; --v6:#E57AA1; --v7:#6CC0CC; --v8:#AEB35A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151B; --surface:#17202A; --sunken:#121A22; --line:#2A3643; --ink:#E5ECF2; --muted:#98A6B4;
  --accent:#72B2DF; --accent-ink:#0C1620; --accent-soft:#1A3248;
  --ok:#6CC892; --ok-soft:#163222; --warn:#F0B44C; --warn-soft:#382A12; --bad:#F2877F; --bad-soft:#3B1C1A;
  --v1:#6AA5DC; --v2:#E58A62; --v3:#5DBE8C; --v4:#B488D6; --v5:#DDB24A; --v6:#E57AA1; --v7:#6CC0CC; --v8:#AEB35A;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1280px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:20px}
h2{font-size:17px}
h3{font-size:15px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);padding:0}
input[type=time]{font-family:var(--f-num)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:18px 10px}
header.top .brand{display:flex;flex-direction:column}
header.top .brand small{color:var(--muted);font-size:12px}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
nav.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;font-weight:500}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.banner{border-radius:var(--r);padding:10px 14px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.banner.info{background:var(--accent-soft)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}

.daybar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.daybar .date{font-family:var(--f-display);font-size:22px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:700}

.layout{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel+.panel{margin-top:14px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
details.panel>summary{cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:15px}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.04em;white-space:nowrap}
tr.off td{color:var(--muted)}
td.c{text-align:center}
.att td{padding:4px 6px}
.att input[type=time]{width:92px;padding:3px 4px;font-size:13px}

.stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-size:13px;background:var(--sunken);border:1px solid var(--line)}
.chip b{font-family:var(--f-num)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}

.issues{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:4px}
.issues li{padding:6px 10px;border-radius:6px;font-size:13px;display:flex;gap:8px}
.issues li.bad{background:var(--bad-soft);color:var(--bad)}
.issues li.warn{background:var(--warn-soft);color:var(--warn)}

/* 運行タイムライン */
.gantt{position:relative;min-width:720px}
.g-row{display:grid;grid-template-columns:130px 1fr;align-items:center;min-height:44px;border-bottom:1px dashed var(--line)}
.g-label{font-size:13px;line-height:1.3;padding-right:8px}
.g-label .num{font-size:11px;color:var(--muted)}
.g-track{position:relative;height:44px}
.g-ruler{position:relative;height:22px;margin-left:130px;border-bottom:1px solid var(--line)}
.g-ruler span{position:absolute;top:0;transform:translateX(-50%);font-size:11px;color:var(--muted)}
.g-grid{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);opacity:.6}
.g-bar{position:absolute;top:7px;height:30px;border-radius:5px;font-size:11px;line-height:1.2;padding:2px 6px;overflow:hidden;white-space:nowrap;cursor:pointer;border:2px solid var(--vc);color:var(--ink)}
.g-bar.pickup{background:color-mix(in srgb,var(--vc) 22%,var(--surface))}
.g-bar.drop{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--vc) 14%,var(--surface)) 0 6px,var(--surface) 6px 12px)}
.g-bar.bad{outline:2px solid var(--bad);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:18px;height:10px;border:2px solid var(--muted);border-radius:3px;vertical-align:middle;margin-right:4px}
.legend i.d{background:repeating-linear-gradient(135deg,var(--sunken) 0 3px,var(--surface) 3px 6px)}

/* 便カード */
.trips{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.trip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.trip.flash{box-shadow:0 0 0 3px var(--accent)}
.trip-h{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--vc,var(--muted)) 10%,var(--surface))}
.trip-h .t{font-family:var(--f-display);font-weight:700}
.trip-h .tm{font-family:var(--f-num);font-size:13px;white-space:nowrap}
.trip-crew{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 8px;padding:8px 12px;align-items:center;font-size:13px}
.trip-crew select{padding:3px 6px;font-size:13px;width:100%}
.stops{list-style:none;margin:0;padding:4px 12px 10px}
.stop{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;padding:6px 0;border-top:1px dotted var(--line)}
.stop .tm{font-family:var(--f-num);font-weight:600}
.stop .tm.late{color:var(--warn)}
.stop .where{font-weight:700;font-size:13px}
.kids{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.kid{display:inline-flex;align-items:center;gap:4px;background:var(--sunken);border:1px solid var(--line);border-radius:999px;padding:1px 4px 1px 10px;font-size:13px}
.kid select{border:0;background:transparent;padding:0 2px;font-size:12px;width:22px;color:var(--muted);cursor:pointer}
.tag{font-size:10px;border-radius:3px;padding:0 4px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.trip-f{margin-top:auto;padding:6px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.section-h{display:flex;align-items:baseline;gap:10px;margin:18px 0 10px}

/* マスタ */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 14px;margin-bottom:12px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.form label.cb{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:14px}
.form .wide{grid-column:1/-1}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days label{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--ink);flex-direction:row;font-size:13px}
.timegrid td input{width:96px}
.swatch{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--vc);vertical-align:middle;margin-right:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.steps{margin:8px 0 0;padding-left:20px}
.steps li{margin:4px 0}
textarea{width:100%;min-height:120px;font-family:var(--f-num);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;z-index:50;font-size:13px}
@media (prefers-reduced-motion:no-preference){.trip{transition:box-shadow .3s}}
/* ボード表示（ホワイトボードのマグネット風） */
.board-sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.board-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.board-top h2{font-size:22px}
.board-h{margin:14px 0 6px}
.board-h .kind{display:inline-block;padding:2px 14px;font-family:var(--f-display);font-weight:700;font-size:17px;color:#fff;background:#2F6FAD;border-radius:3px}
.board-h .kind.drop{background:#2F6FAD}
table.mg td{vertical-align:middle;padding:5px 6px}
table.mg{table-layout:fixed;min-width:640px}
table.mg th:nth-child(1),table.mg th:nth-child(2){width:17%}
table.mg th:nth-child(4),table.mg th:nth-child(5){width:12%}
.mg-kid{max-width:100%}
table.mg tr.mg-first td{border-top:2px solid var(--line)}
table.mg td[rowspan]{border-bottom:2px solid var(--line)}
.mg-car{display:inline-block;border:3px solid var(--vc);border-radius:4px;padding:1px 10px;font-family:var(--f-display);font-weight:700;font-size:16px;white-space:nowrap;background:var(--surface)}
.mg-drv{display:inline-block;background:#F7D23A;color:#17212B;padding:1px 10px;font-family:var(--f-display);font-weight:700;font-size:16px;white-space:nowrap}
.mg-sub{font-size:11px;color:var(--muted);margin-top:2px}
.mg-label{display:inline-block;border:1px solid var(--line);background:var(--surface);padding:1px 12px;font-family:var(--f-display);font-weight:700;font-size:16px}
.mg-kid{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:5.5em;border:1px solid var(--line);background:var(--surface);padding:1px 8px;margin:2px 4px 2px 0;line-height:1.25;box-shadow:0 1px 2px rgba(0,0,0,.12);white-space:nowrap;font-weight:500}
.mg-kid small{font-size:10px;color:var(--muted);font-weight:400}
.mg-tm{font-family:var(--f-num);font-size:17px;font-weight:600;white-space:nowrap}
@media print{
  @page{size:A4 portrait;margin:8mm}
  :root{color-scheme:light}
  body{background:#fff;padding:0}
  header.top,nav.tabs,#banners,.daybar,.layout>div:first-child,.stats,.issues,.actions,#copy-area,.no-print,.toast{display:none!important}
  .layout{display:block}
  .board-sheet{border:0;padding:0}
}
/* まとめて作成 */
.bulk-days{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
/* 送迎の記録（スマホで押しやすく） */
.rec-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.rec-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px}
.rec-row input[type=time]{font-size:16px;width:120px}
.rec-row .lab{width:3em;color:var(--muted);font-size:13px}
.rec-stop{padding:6px 12px;border-top:1px dotted var(--line)}
.rec-kid{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:15px;cursor:pointer;margin:4px 4px 0 0;background:var(--surface)}
.rec-kid input{width:22px;height:22px}
.rec-kid:has(input:checked){background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.rec-note{width:100%;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1 id="facTitle">送迎表メーカー</h1><small>放課後等デイサービス 送迎の自動編成</small></div>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div id="banners"></div>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="js/app.js"></script>

</body></html>
